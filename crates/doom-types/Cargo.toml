[package]
name    = "doom-types"
version.workspace = true
edition.workspace = true

# no_std compatible — verified core must be pure math, no OS calls
[features]
default = ["std"]
std     = []

[dependencies]
libm = "0.2.16"
spin = { version = "0.9.8", features = ["once"] }
strum = "0.28.0"
strum_macros = "0.28.0"

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "fixed_point"
harness = false

[[bench]]
name    = "fixed_bench"
harness = false

[[bench]]
name    = "angle_bench"
harness = false
