[package]
name    = "doom-types"
version.workspace = true
edition.workspace = true

# no_std compatible — verified core must be pure math, no OS calls
[features]
default = ["std"]
std     = []

[dependencies]

[dev-dependencies]
proptest  = { workspace = true }
criterion = { workspace = true }
loom = "0.7.2"

[[bench]]
name    = "fixed_point"
harness = false

[[bench]]
name    = "fixed_bench"
harness = false

[[bench]]
name    = "angle_bench"
harness = false
