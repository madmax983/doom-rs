[package]
name    = "doom-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "doom-app"
path = "src/main.rs"

[dependencies]
ratatui = { workspace = true }
crossterm = { workspace = true }
doom-types    = { workspace = true }
doom-wad      = { workspace = true }
doom-map      = { workspace = true }
doom-game     = { workspace = true }
doom-renderer = { workspace = true }
doom-tui      = { workspace = true }
doom-audio    = { workspace = true }
doom-net      = { workspace = true }
doom-demo     = { workspace = true }
clap          = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
loom          = { version = "0.7", optional = true }
log = "0.4.29"
comfy-table = "7.2.2"

[dev-dependencies]
strum = "0.28.0"
loom = "0.7"
tempfile = "3.10"

[features]
loom = ["dep:loom", "doom-audio/loom"]
sound_ripples = []
style_meter = ["doom-game/style_meter", "doom-tui/style_meter"]
telemetry = ["doom-game/telemetry"]
wad_explorer = []
